services:
  postgres:
    image: postgres:16-alpine
    container_name: despensa-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: despensa_fernando
    volumes:
      - despensa_pg_data:/var/lib/postgresql/data

volumes:
  despensa_pg_data:
